name: CI-guided-navigation
on:
  push:
    paths:
      - 'guided-navigation/**'
      - 'helpers/**'
      - 'shared/**'
      - '.github/workflows/CI-guided-navigation.yml'
      - 'pnpm-lock.yaml'

jobs:
  build:
    name: Build and test on Node ${{ matrix.node }} and ${{ matrix.os }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./guided-navigation
    strategy:
      matrix:
        node: ['24.x', '26.x']
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Test
        run: pnpm run test --ci --maxWorkers=2

      - name: Build
        run: pnpm run build
