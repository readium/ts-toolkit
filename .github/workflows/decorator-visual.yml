name: Decorator visual regression

on:
  push:
    branches: ["develop"]
    paths:
      - "decorator/**"
      - "navigator-html-injectables/**"
      - "helpers/**"
      - "shared/**"
      - ".github/workflows/decorator-visual.yml"
  pull_request:
    branches: ["develop"]
    paths:
      - "decorator/**"
      - "navigator-html-injectables/**"
      - "helpers/**"
      - "shared/**"
      - ".github/workflows/decorator-visual.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./decorator
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: decorator/test/playwright-report/
          retention-days: 14
