name: Decorator update snapshots

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./decorator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:update

      # Protected branches only take changes through pull requests.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: decorator-snapshots/${{ github.ref_name }}
          delete-branch: true
          add-paths: decorator/test/snapshots/**/*.png
          commit-message: Update decorator snapshots
          title: Update decorator snapshots
          body: Reference screenshots regenerated by the “Decorator update snapshots” workflow on `${{ github.ref_name }}`.
